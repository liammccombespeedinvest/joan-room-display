<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title>Lovelace — Joan room status proof of concept</title>
  <style>
    :root {
      --ink: #111;
      --paper: #fff;
      --muted: #555;
      --rule: #1a1a1a;
      --edge: clamp(26px, 8vw, 58px);
      --serif: "Ancizar Serif", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      min-height: 360px;
      padding: clamp(30px, 6vh, 52px) var(--edge) clamp(28px, 5vh, 46px);
      background: var(--paper);
    }

    .room-name,
    .status,
    .meeting-title {
      font-family: var(--serif);
      font-weight: 400;
    }

    .room-name {
      margin: 0;
      font-size: clamp(25px, 7.3vw, 42px);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .availability {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: clamp(22px, 5vh, 42px) 0;
    }

    .availability::before,
    .next-meeting::before {
      display: block;
      width: 100%;
      height: 2px;
      margin-bottom: clamp(18px, 3.8vh, 30px);
      background: var(--rule);
      content: "";
    }

    .status {
      margin: 0;
      font-size: clamp(76px, 23vw, 136px);
      line-height: 0.82;
      letter-spacing: -0.065em;
    }

    .until {
      margin: clamp(22px, 4vh, 34px) 0 0;
      font-size: clamp(18px, 5.5vw, 30px);
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .until-time {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .next-meeting {
      align-self: end;
    }

    .eyebrow {
      margin: 0 0 clamp(10px, 2vh, 16px);
      color: var(--muted);
      font-size: clamp(14px, 3.7vw, 20px);
      line-height: 1;
    }

    .meeting-title {
      margin: 0;
      font-size: clamp(30px, 8.5vw, 50px);
      line-height: 1;
      letter-spacing: -0.03em;
      overflow-wrap: anywhere;
    }

    .meeting-time {
      margin: clamp(13px, 2.5vh, 20px) 0 0;
      font-size: clamp(17px, 4.6vw, 25px);
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .preview-controls {
      position: fixed;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      display: none;
      gap: 6px;
      padding: 6px;
      border: 1px solid #999;
      background: #fff;
      font: 12px/1 var(--sans);
    }

    .show-controls .preview-controls {
      display: flex;
    }

    .preview-controls button {
      min-width: 54px;
      padding: 8px 10px;
      border: 1px solid #111;
      border-radius: 0;
      background: #fff;
      color: #111;
      font: inherit;
      cursor: pointer;
    }

    .preview-controls button[aria-pressed="true"] {
      background: #111;
      color: #fff;
    }

    @media (max-height: 520px) {
      .panel {
        padding-top: 24px;
        padding-bottom: 22px;
      }

      .availability {
        padding: 18px 0;
      }

      .availability::before,
      .next-meeting::before {
        margin-bottom: 14px;
      }

      .status {
        font-size: clamp(58px, 18vh, 92px);
      }

      .until {
        margin-top: 14px;
      }

      .meeting-title {
        font-size: clamp(25px, 7vh, 38px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }

    @media print {
      .preview-controls {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="Room availability">
    <header>
      <h1 class="room-name" id="roomName">Lovelace</h1>
    </header>

    <section class="availability" aria-live="polite">
      <p class="status" id="status">Free</p>
      <p class="until"><span id="untilLabel">Until</span> <span class="until-time" id="untilTime">17:00</span></p>
    </section>

    <section class="next-meeting">
      <p class="eyebrow" id="nextLabel">Next</p>
      <p class="meeting-title" id="meetingTitle">Test test</p>
      <p class="meeting-time" id="meetingTime">17:00–18:00</p>
    </section>
  </main>

  <nav class="preview-controls" aria-label="Prototype state">
    <button type="button" data-state="free">Free</button>
    <button type="button" data-state="busy">Busy</button>
  </nav>

  <script>
    /*
      Edit these values when testing different fake room states.
      You can also use ?state=busy or ?state=free in the URL.
      Add ?controls=1 to show small Free/Busy preview buttons.
    */
    const DISPLAY_DATA = {
      free: {
        roomName: "Lovelace",
        status: "Free",
        untilLabel: "Until",
        untilTime: "17:00",
        nextLabel: "Next",
        meetingTitle: "Test test",
        meetingTime: "17:00–18:00"
      },
      busy: {
        roomName: "Lovelace",
        status: "Busy",
        untilLabel: "Until",
        untilTime: "16:30",
        nextLabel: "Next free",
        meetingTitle: "From 16:30",
        meetingTime: "Next meeting 17:00"
      }
    };

    const params = new URLSearchParams(window.location.search);
    let activeState = params.get("state") in DISPLAY_DATA ? params.get("state") : "free";

    if (params.get("controls") === "1") {
      document.body.classList.add("show-controls");
    }

    function render(stateName) {
      const data = DISPLAY_DATA[stateName] || DISPLAY_DATA.free;
      activeState = stateName in DISPLAY_DATA ? stateName : "free";

      Object.entries(data).forEach(([id, value]) => {
        const element = document.getElementById(id);
        if (element) element.textContent = value;
      });

      document.querySelectorAll("[data-state]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.state === activeState));
      });
    }

    document.querySelectorAll("[data-state]").forEach((button) => {
      button.addEventListener("click", () => render(button.dataset.state));
    });

    render(activeState);
  </script>
</body>
</html>
