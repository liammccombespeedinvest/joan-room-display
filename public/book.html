<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Book a room</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 22px;
      color: #111;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { max-width: 520px; margin: 0 auto; }
    h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
    h1 { margin: 0; font-size: 44px; }
    hr { margin: 20px 0 28px; border: 0; border-top: 1px solid #111; }
    h2 { margin: 0 0 10px; font-size: 36px; line-height: 1.05; }
    #status-detail { margin: 0 0 28px; font-size: 21px; }
    #prompt { margin: 0 0 14px; font-size: 22px; font-weight: 700; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      min-height: 64px;
      padding: 14px;
      border: 2px solid #111;
      border-radius: 0;
      color: #111;
      background: #fff;
      font: 700 22px/1 Arial, Helvetica, sans-serif;
    }
    button.primary { color: #fff; background: #111; }
    button:disabled { opacity: .45; }
    #confirm, #result { margin-top: 28px; }
    #confirm p, #result { font-size: 21px; line-height: 1.3; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="room-name">Room</h1>
    <hr>
    <h2 id="status">Checking availability…</h2>
    <p id="status-detail"></p>

    <section id="choices" hidden>
      <p id="prompt">Book now</p>
      <div class="actions">
        <button class="duration" data-duration="15" type="button">15 minutes</button>
        <button class="duration" data-duration="30" type="button">30 minutes</button>
      </div>
    </section>

    <section id="confirm" hidden>
      <p id="confirm-text"></p>
      <div class="actions">
        <button id="submit" class="primary" type="button">Confirm</button>
        <button id="cancel" type="button">Cancel</button>
      </div>
    </section>
    <p id="result" hidden></p>
  </main>

  <script>
    var queryMatch = location.search.match(/[?&]room=([^&]+)/i);
    var roomKey = queryMatch ? decodeURIComponent(queryMatch[1].replace(/\+/g, " ")).toLowerCase() : "lovelace";
    var keyMatch = location.hash.match(/(?:^#|&)book=([^&]+)/i);
    var bookingKey = keyMatch ? decodeURIComponent(keyMatch[1]) : "";
    var chosenDuration = null;

    function element(id) { return document.getElementById(id); }
    function setText(id, value) { element(id).textContent = value || ""; }

    function loadStatus() {
      if (!bookingKey) {
        setText("status", "Booking link unavailable");
        setText("status-detail", "Please scan the QR code again.");
        return;
      }
      var request = new XMLHttpRequest();
      request.open("GET", "/api/room?room=" + encodeURIComponent(roomKey) + "&t=" + Date.now(), true);
      request.onload = function () {
        if (request.status < 200 || request.status >= 300) {
          setText("status", "Status unavailable");
          return;
        }
        var data = JSON.parse(request.responseText);
        setText("room-name", data.room);
        if (data.status === "busy") {
          setText("status", "Currently busy");
          setText("status-detail", data.until ? "Available after " + data.until : "Please try again later.");
          element("choices").hidden = true;
        } else {
          setText("status", "Available now");
          setText("status-detail", data.until ? "Free until " + data.until : "Free for the rest of the day");
          element("choices").hidden = false;
        }
      };
      request.onerror = function () { setText("status", "Status unavailable"); };
      request.send();
    }

    function choose(duration) {
      chosenDuration = duration;
      element("choices").hidden = true;
      element("confirm").hidden = false;
      setText("confirm-text", "Book " + roomKey.charAt(0).toUpperCase() + roomKey.slice(1) + " for " + duration + " minutes?");
    }

    function submit() {
      element("submit").disabled = true;
      element("cancel").disabled = true;
      element("result").hidden = false;
      setText("result", "Booking…");
      var request = new XMLHttpRequest();
      request.open("POST", "/api/book", true);
      request.setRequestHeader("Content-Type", "application/json");
      request.setRequestHeader("X-Booking-Key", bookingKey);
      request.onload = function () {
        var response = {};
        try { response = JSON.parse(request.responseText); } catch (error) {}
        if (request.status >= 200 && request.status < 300) {
          element("confirm").hidden = true;
          setText("status", "Booked");
          setText("status-detail", "The room is yours.");
          setText("result", "You can close this page.");
        } else {
          element("submit").disabled = false;
          element("cancel").disabled = false;
          setText("result", response.error || "The room could not be booked.");
        }
      };
      request.onerror = function () {
        element("submit").disabled = false;
        element("cancel").disabled = false;
        setText("result", "The booking service could not be reached.");
      };
      request.send(JSON.stringify({ room: roomKey, duration: chosenDuration }));
    }

    var durationButtons = document.getElementsByClassName("duration");
    for (var i = 0; i < durationButtons.length; i += 1) {
      durationButtons[i].onclick = function () { choose(Number(this.getAttribute("data-duration"))); };
    }
    element("cancel").onclick = function () {
      chosenDuration = null;
      element("confirm").hidden = true;
      element("choices").hidden = false;
      element("result").hidden = true;
    };
    element("submit").onclick = submit;
    loadStatus();
  </script>
</body>
</html>
