<!doctype html>
<html lang="en" data-api-base="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Room status</title>
  <style>
    :root {
      color: #111;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      min-height: 100vh;
      padding: 28px 24px;
      padding: clamp(18px, 7vw, 42px) clamp(16px, 8vw, 46px);
    }

    main {
      display: flex;
      min-height: calc(100vh - 56px);
      min-height: calc(100vh - clamp(36px, 14vw, 84px));
      flex-direction: column;
    }

    .serif {
      font-family: "Ancizar Serif", Georgia, "Times New Roman", serif;
      font-weight: 400;
    }

    #room-name {
      margin: 0;
      font-size: 34px;
      font-size: clamp(25px, 9vw, 44px);
      line-height: 1;
    }

    hr {
      width: 100%;
      margin: 22px 0;
      margin: clamp(14px, 5vh, 30px) 0;
      border: 0;
      border-top: 1px solid #111;
    }

    #status {
      margin: 0;
      font-size: 72px;
      font-size: clamp(50px, 20vw, 98px);
      line-height: .9;
    }

    #status.current-meeting {
      display: -webkit-box;
      overflow: hidden;
      padding-bottom: 6px;
      font-size: 64px;
      font-size: clamp(58px, 16vw, 72px);
      line-height: 1.15;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    #status-label {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 700;
    }

    #current-organizer {
      margin: 16px 0 0;
      font-size: 31px;
      font-size: clamp(28px, 8vw, 36px);
      line-height: 1.25;
    }

    #availability {
      min-height: 1.3em;
      margin: 18px 0 0;
      margin: clamp(16px, 4vh, 24px) 0 0;
      font-size: 36px;
      font-size: clamp(32px, 9vw, 42px);
      line-height: 1.25;
    }

    #availability strong { font-weight: 700; }

    #booking {
      margin-top: 26px;
    }

    #booking p {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.15;
    }

    .booking-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .booking-button {
      min-height: 54px;
      padding: 10px 16px;
      border: 2px solid #111;
      border-radius: 0;
      color: #111;
      background: #fff;
      font: 700 24px/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .booking-button.primary {
      color: #fff;
      background: #111;
    }

    #book-message {
      margin-top: 12px;
      font-size: 20px;
      font-weight: 400;
    }

    .meeting-section {
      margin-top: auto;
      margin-bottom: 44px;
    }

    .meeting-section hr {
      margin-top: 24px;
      margin-top: clamp(18px, 5vh, 32px);
      margin-bottom: 14px;
      margin-bottom: clamp(10px, 3vh, 18px);
    }

    #meeting-label {
      margin: 0 0 6px;
      color: #333;
      font-size: 24px;
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 700;
    }

    #meeting-title {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      padding-bottom: 5px;
      font-size: 48px;
      font-size: clamp(42px, 12vw, 56px);
      line-height: 1.15;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    #organizer, #meeting-time {
      margin: 12px 0 0;
      font-size: 29px;
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.25;
    }

    #freshness {
      margin: 8px 0 0;
      color: #555;
      font-size: 10px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <h1 id="room-name" class="serif">Lovelace</h1>
    <hr>
    <section>
      <p id="status-label" hidden>Now</p>
      <h2 id="status" class="serif">Loading</h2>
      <p id="current-organizer" hidden></p>
      <p id="availability">Checking the room…</p>
      <section id="booking" hidden>
        <button id="book-open" class="booking-button primary" type="button">Book now</button>
        <div id="book-options" hidden>
          <p>Choose a duration</p>
          <div class="booking-actions">
            <button class="booking-button duration-button" data-duration="15" type="button">15 min</button>
            <button class="booking-button duration-button" data-duration="30" type="button">30 min</button>
            <button id="book-options-cancel" class="booking-button" type="button">Cancel</button>
          </div>
        </div>
        <div id="book-confirm" hidden>
          <p id="book-confirm-text"></p>
          <div class="booking-actions">
            <button id="book-submit" class="booking-button primary" type="button">Confirm</button>
            <button id="book-cancel" class="booking-button" type="button">Cancel</button>
          </div>
        </div>
        <p id="book-message" hidden></p>
      </section>
    </section>

    <section id="meeting" class="meeting-section" hidden>
      <hr>
      <p id="meeting-label">Next</p>
      <h3 id="meeting-title" class="serif"></h3>
      <p id="organizer" hidden></p>
      <p id="meeting-time"></p>
      <p id="freshness" hidden></p>
    </section>
  </main>

  <script>
    // For GitHub Pages, replace the placeholder below with the Vercel project URL.
    // When this page is served by the same Vercel project, leave data-api-base blank.
    var PLACEHOLDER_API_BASE = "https://YOUR-VERCEL-PROJECT.vercel.app";
    var configuredBase = (document.documentElement.getAttribute("data-api-base") || "").replace(/^\s+|\s+$/g, "").replace(/\/$/, "");
    var API_BASE = configuredBase || (location.hostname.indexOf("vercel.app") !== -1 ? "" : PLACEHOLDER_API_BASE);
    var queryMatch = location.search.match(/[?&]room=([^&]+)/i);
    var roomKey = queryMatch ? decodeURIComponent(queryMatch[1].replace(/\+/g, " ")).toLowerCase() : "lovelace";
    var bookingMatch = location.hash.match(/(?:^#|&)book=([^&]+)/i);
    var bookingKey = bookingMatch ? decodeURIComponent(bookingMatch[1]) : "";
    var refreshMs = 60000;
    var hasLiveData = false;
    var chosenDuration = null;

    function element(id) { return document.getElementById(id); }

    function setText(id, value) {
      element(id).textContent = value || "";
    }

    function bindTap(target, handler) {
      var handledByTouch = false;
      target.ontouchend = function (event) {
        handledByTouch = true;
        if (event && event.preventDefault) event.preventDefault();
        handler.call(target, event);
        setTimeout(function () { handledByTouch = false; }, 700);
      };
      target.onclick = function (event) {
        if (!handledByTouch) handler.call(target, event);
      };
    }

    function resetBooking() {
      chosenDuration = null;
      element("book-open").hidden = false;
      element("book-options").hidden = true;
      element("book-confirm").hidden = true;
      element("book-message").hidden = true;
      element("book-submit").disabled = false;
    }

    function render(data) {
      hasLiveData = true;
      setText("room-name", data.room);
      var showingCurrentMeeting = data.status === "busy" && data.current;
      setText("status", showingCurrentMeeting ? data.current.title : (data.status === "busy" ? "Busy" : "Free"));
      element("status").className = showingCurrentMeeting ? "serif current-meeting" : "serif";
      element("status-label").hidden = !showingCurrentMeeting;
      setText("current-organizer", showingCurrentMeeting ? data.current.organizer : "");
      element("current-organizer").hidden = !showingCurrentMeeting || !data.current.organizer;
      setText("availability", data.until ? "Until " + data.until : "For the rest of the day");

      var canBook = data.status === "free" && bookingKey;
      element("booking").hidden = !canBook;
      if (!canBook) resetBooking();

      if (data.next) {
        element("meeting").hidden = false;
        setText("meeting-title", data.next.title);
        setText("meeting-time", data.next.start + "–" + data.next.end);
        setText("organizer", data.next.organizer);
        element("organizer").hidden = !data.next.organizer;
      } else {
        element("meeting").hidden = true;
      }
    }

    function renderError() {
      if (hasLiveData) return;
      setText("status", "Offline");
      setText("availability", "Status unavailable — retrying");
      element("meeting").hidden = true;
      element("booking").hidden = true;
    }

    function openBookingOptions() {
      element("book-open").hidden = true;
      element("book-options").hidden = false;
      element("book-confirm").hidden = true;
      element("book-message").hidden = true;
    }

    function chooseDuration(duration) {
      chosenDuration = duration;
      element("book-options").hidden = true;
      element("book-confirm").hidden = false;
      setText("book-confirm-text", "Book for " + duration + " minutes?");
    }

    function showBookingMessage(message) {
      setText("book-message", message);
      element("book-message").hidden = false;
    }

    function submitBooking() {
      if (!chosenDuration) return;
      element("book-submit").disabled = true;
      showBookingMessage("Booking…");

      var request = new XMLHttpRequest();
      request.open("POST", API_BASE + "/api/book", true);
      request.timeout = 20000;
      request.setRequestHeader("Content-Type", "application/json");
      request.setRequestHeader("X-Booking-Key", bookingKey);
      request.onload = function () {
        var response = {};
        try { response = JSON.parse(request.responseText); } catch (error) {}
        if (request.status >= 200 && request.status < 300) {
          element("book-confirm").hidden = true;
          showBookingMessage("Booked — updating display…");
          setTimeout(update, 3000);
          setTimeout(update, 35000);
        } else {
          element("book-submit").disabled = false;
          showBookingMessage(response.error || "Could not book the room");
        }
      };
      request.onerror = function () {
        element("book-submit").disabled = false;
        showBookingMessage("Could not reach the booking service");
      };
      request.ontimeout = request.onerror;
      request.send(JSON.stringify({ room: roomKey, duration: chosenDuration }));
    }

    function update() {
      var request = new XMLHttpRequest();
      var url = API_BASE + "/api/room?room=" + encodeURIComponent(roomKey) + "&t=" + Date.now();
      request.open("GET", url, true);
      request.timeout = 15000;
      request.onload = function () {
        if (request.status >= 200 && request.status < 300) {
          try {
            render(JSON.parse(request.responseText));
          } catch (error) {
            renderError();
          }
        } else {
          renderError();
        }
      };
      request.onerror = renderError;
      request.ontimeout = renderError;
      request.send();
    }

    update();
    setInterval(update, refreshMs);
    bindTap(element("book-open"), openBookingOptions);
    bindTap(element("book-options-cancel"), resetBooking);
    bindTap(element("book-cancel"), resetBooking);
    bindTap(element("book-submit"), submitBooking);
    var durationButtons = document.getElementsByClassName("duration-button");
    for (var i = 0; i < durationButtons.length; i += 1) {
      (function (button) {
        bindTap(button, function () {
          chooseDuration(Number(button.getAttribute("data-duration")));
        });
      }(durationButtons[i]));
    }
  </script>
</body>
</html>
